name: Stability checks

on:
  push:
    branches:
      - fix/stability-audit-2026-11-06
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Test settings API
        run: node --test tests/api-*.test.cjs
      - name: Build production assets
        run: npm run build
